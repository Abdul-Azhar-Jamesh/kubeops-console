name: Workload checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: docker build -t kubeops-utility:test workloads/utility
      - name: Check the running container
        run: |
          docker run -d --name utility-test -p 127.0.0.1:8080:8080 kubeops-utility:test
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 http://127.0.0.1:8080/health/ready
      - name: Container logs
        if: failure()
        run: docker logs utility-test || true
      - name: Create a disposable Kubernetes cluster
        run: |
          curl --fail --location --output /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x /tmp/kind
          /tmp/kind create cluster --name kubeops --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed --wait 3m
          docker tag kubeops-utility:test kubeops-utility:v1
          /tmp/kind load docker-image kubeops-utility:v1 --name kubeops
      - name: Deploy and verify the Kubernetes workload
        run: |
          kubectl --context kind-kubeops apply -k k8s
          kubectl --context kind-kubeops -n kubeops-demo rollout status deployment/kubeops-utility --timeout=90s
          python scripts/kubernetes_smoke.py
      - name: Verify the read-only dashboard
        run: |
          viewer=system:serviceaccount:kubeops-demo:kubeops-viewer
          test "$(kubectl --context kind-kubeops -n kubeops-demo auth can-i get deployment/kubeops-utility --as=$viewer)" = yes
          test "$(kubectl --context kind-kubeops -n kubeops-demo auth can-i patch deployments --as=$viewer)" = no
          test "$(kubectl --context kind-kubeops -n kubeops-demo auth can-i get secrets --as=$viewer)" = no
          test "$(kubectl --context kind-kubeops -n kubeops-demo auth can-i get pods/log --as=$viewer)" = yes
          test "$(kubectl --context kind-kubeops -n kubeops-demo auth can-i create pods/exec --as=$viewer)" = no
          test "$(kubectl --context kind-kubeops -n kubeops-demo auth can-i list events --as=$viewer)" = yes
          test "$(kubectl --context kind-kubeops -n kubeops-demo auth can-i create events --as=$viewer)" = no
          python dashboard/main.py >dashboard.log 2>&1 &
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 25 --output /tmp/dashboard.html http://127.0.0.1:8000/
          python -c "from pathlib import Path; p=Path('/tmp/dashboard.html').read_text(); assert 'Ready replicas:' in p and 'kubeops-utility-' in p and 'kubeops-utility:v1' in p"
          python -c "from pathlib import Path; p=Path('/tmp/dashboard.html').read_text(); assert 'Service endpoints' in p and 'IPv4' in p and '8080/TCP' in p and 'Service ports and selectors' in p and 'app=kubeops-utility' in p and 'Deployment rollout conditions' in p and 'NewReplicaSetAvailable' in p and '<th>Ready</th>' in p and '<th>Reason</th>' in p and '<th>QoS</th>' in p and 'Burstable' in p"
          python -c "from pathlib import Path; p=Path('/tmp/dashboard.html').read_text().split('<h2>Resource requests and limits</h2>')[1].split('<h2>Related events</h2>')[0]; assert 'Deployment template' in p and all(v in p for v in ('100m','250m','64Mi','128Mi'))"
          python -c "import urllib.request; from urllib.parse import urlencode; from dashboard.main import read; pods=read('pods','-l','app=kubeops-utility')['items']; name=next(p['metadata']['name'] for p in pods if not p['metadata'].get('deletionTimestamp')); html=urllib.request.urlopen('http://127.0.0.1:8000/logs?'+urlencode({'pod':name}),timeout=25).read().decode(); assert 'Latest 200 lines' in html and name in html"
          python - <<'PY'
          import json, subprocess, urllib.request
          from dashboard.main import read
          service = read('service', 'kubeops-utility')
          for uid, reason in [(service['metadata']['uid'], 'DashboardSmokeRelated'), ('unrelated-uid', 'DashboardSmokeUnrelated')]:
              event = {'apiVersion': 'v1', 'kind': 'Event', 'metadata': {'generateName': 'dashboard-smoke-', 'namespace': 'kubeops-demo'},
                       'involvedObject': {'apiVersion': 'v1', 'kind': 'Service', 'namespace': 'kubeops-demo', 'name': 'kubeops-utility', 'uid': uid},
                       'type': 'Normal', 'reason': reason, 'message': 'CI event visibility check', 'source': {'component': 'kubeops-ci'}}
              subprocess.run(['kubectl', '--context', 'kind-kubeops', 'create', '-f', '-'], input=json.dumps(event), text=True, check=True, timeout=15)
          html = urllib.request.urlopen('http://127.0.0.1:8000/', timeout=30).read().decode()
          assert 'DashboardSmokeRelated' in html and 'DashboardSmokeUnrelated' not in html
          PY
      - name: Kubernetes failure evidence
        if: failure()
        run: |
          kubectl --context kind-kubeops -n kubeops-demo get pods,services -o wide || true
          kubectl --context kind-kubeops -n kubeops-demo get events --sort-by=.lastTimestamp || true
          kubectl --context kind-kubeops -n kubeops-demo logs deployment/kubeops-utility || true
          cat dashboard.log || true
      - name: Delete the disposable cluster
        if: always()
        run: if [ -x /tmp/kind ]; then /tmp/kind delete cluster --name kubeops; fi
