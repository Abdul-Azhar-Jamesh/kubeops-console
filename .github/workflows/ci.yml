name: Workload checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: docker build -t kubeops-utility:test workloads/utility
      - name: Check the running container
        run: |
          docker run -d --name utility-test -p 127.0.0.1:8080:8080 kubeops-utility:test
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 http://127.0.0.1:8080/health/ready
      - name: Container logs
        if: failure()
        run: docker logs utility-test || true
