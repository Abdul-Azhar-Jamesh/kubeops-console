apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeops-viewer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeops-viewer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [kubeops-utility]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [kubeops-utility]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeops-viewer
subjects:
  - kind: ServiceAccount
    name: kubeops-viewer
    namespace: kubeops-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeops-viewer
